services:
  caddy:
    ports: !override
      - "127.0.0.1:8090:80"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  api:
    environment:
      COOKIE_SECURE: "false"
      METRICS_URL: "http://host.docker.internal:9182/metrics"
